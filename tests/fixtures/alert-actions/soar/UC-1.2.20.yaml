# Splunk SOAR playbook stub — generated from catalogue metadata.
# Import manually into SOAR; customise escalation contacts before production use.
name: "FP Triage: Windows Print Spooler and Print-Job Failures"
uc_id: "UC-1.2.20"
uc_url: "https://fenre.github.io/splunk-monitoring-use-cases/uc/UC-1.2.20/"
description: |
  Alerts on either three or more Microsoft PrintService Event 372 print-job failures for the same host and printer during one closed five-minute window, or any Event 808 spooler plug-in load failure. It preserves native byte, page, client, module, error, record, and source context while explicitly treating each row as historical Admin-channel evidence rather than current queue or service state.

  Business value: Bursts of failed print jobs can interrupt shipping, labeling, clinical, finance, and office workflows, while a plug-in load failure can destabilize a shared print server or prevent driver-dependent queues from working. Separating documented error events from ordinary rendering and driver-isolation diagnostics gives responders earlier, lower-noise evidence and the exact Windows context needed to distinguish queue, network, driver, resource, and component problems.
human_acknowledgement_required: true
escalation_contact_placeholder: "{customer-on-call}"
pre_conditions: |
  Human-in-the-loop required for OT/safety-critical actions. Confirm alert is not a known maintenance window or approved test activity. OT engineering acknowledgement is mandatory before any action that touches process control or safety systems.
do_not_section: |
  Do NOT disable safety instrumented functions, write to PLCs/HMIs/DCS/RTUs, or execute automated containment against Level 0/1/2 OT assets without human-in-the-loop approval from OT engineering.
spl_reference: "index=wineventlog earliest=-10m@m latest=-5m@m ((sourcetype=\"XmlWinEventLog\" source=\"XmlWinEventLog:Microsoft-Windows-PrintService/Admin\") OR sourcetype=\"XmlWinEventLog:Microsoft-Windows-PrintService/Admin\" OR sourcetype=\"WinEventLog:Microsoft-Windows-PrintService/Admin\") EventCode IN (372,808)\n| eval event_code=tonumber(coalesce(EventCode,EventID,event_id)), provider_name=coalesce(Provider_Name,ProviderName,SourceName,EventSourceName), event_record_id=coalesce(EventRecordID,'System.EventRecordID')\n| where in(event_code,372,808) AND (provider_name=\"Microsoft-Windows-PrintService\" OR match(_raw,\"(?i)Provider Name=['\\\"]Microsoft-Windows-PrintService['\\\"]\"))\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param1 output=document_name\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param2 output=document_owner\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param3 output=printer_name\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param4 output=data_type\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param5 output=spool_bytes_raw\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param6 output=printed_bytes_raw\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param7 output=total_pages_raw\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param8 output=printed_pages_raw\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param9 output=client_computer\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param10 output=win32_error_code\n| spath input=_raw path=Event.UserData.PrintOnProcFailedEd.Param11 output=win32_error_text\n| spath input=_raw path=Event.UserData.LoadPluginFailed.PluginDllName output=plugin_module\n| spath input=_raw path=Event.UserData.LoadPluginFailed.ErrorCode output=plugin_error_code\n| spath input=_raw path=Event.UserData.LoadPluginFailed.Context output=plugin_context\n| eval document_name=coalesce(document_name,'PrintOnProcFailedEd.Param1'), document_owner=coalesce(document_owner,'PrintOnProcFailedEd.Param2'), printer_name=coalesce(printer_name,'PrintOnProcFailedEd.Param3'), data_type=coalesce(data_type,'PrintOnProcFailedEd.Param4'), spool_bytes=tonumber(coalesce(spool_bytes_raw,'PrintOnProcFailedEd.Param5')), printed_bytes=tonumber(coalesce(printed_bytes_raw,'PrintOnProcFailedEd.Param6')), total_pages=tonumber(coalesce(total_pages_raw,'PrintOnProcFailedEd.Param7')), printed_pages=tonumber(coalesce(printed_pages_raw,'PrintOnProcFailedEd.Param8')), client_computer=coalesce(client_computer,'PrintOnProcFailedEd.Param9'), win32_error_code=coalesce(win32_error_code,'PrintOnProcFailedEd.Param10'), win32_error_text=coalesce(win32_error_text,'PrintOnProcFailedEd.Param11'), plugin_module=coalesce(plugin_module,PluginDllName), plugin_error_code=coalesce(plugin_error_code,ErrorCode), plugin_context=coalesce(plugin_context,Context)\n| eval issue_type=if(event_code=372,\"print_job_failure_burst\",\"spooler_plugin_load_failure\"), entity=if(event_code=372,printer_name,plugin_module), error_code=if(event_code=372,win32_error_code,plugin_error_code), threshold_events=if(event_code=372,3,1), threshold_window_minutes=5\n| where len(trim(entity))>0\n| stats count as observed_events min(_time) as first_seen max(_time) as last_seen max(_indextime) as last_indexed values(event_record_id) as event_record_ids latest(document_name) as document_name latest(document_owner) as document_owner latest(data_type) as data_type latest(spool_bytes) as spool_bytes latest(printed_bytes) as printed_bytes latest(total_pages) as total_pages latest(printed_pages) as printed_pages latest(client_computer) as client_computer latest(win32_error_text) as error_text latest(plugin_context) as plugin_context latest(_raw) as sample_raw by host event_code issue_type entity error_code threshold_events threshold_window_minutes source sourcetype\n| where observed_events>=threshold_events\n| eval unit=\"Windows error events per closed five-minute window\", observation_s\n... [truncated]"
mitre_tags:
  - "N/A (operational PrintService error monitoring; no adversary behavior or malicious module is inferred)"
regulatory_tags:
  []
playbook_contract:
  start: filter_and_decide
  branches:
    - investigate
    - notify
    - end
  notes: |
    One playbook per UC alert. Mirror the atomic runbook for UC-1.2.20.
    Never execute OT/safety-impacting containment without human approval.
