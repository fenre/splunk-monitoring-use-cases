<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starter packs — Use Case Catalog</title>
<script>
(function () {
  var path = location.pathname;
  var cut = path.indexOf("/api/v1/starter-packs");
  var root = cut >= 0 ? path.slice(0, cut) : "";
  var h = (location.hash || "").replace(/^#/, "");
  var dest = root + "/#packs";
  if (h.indexOf("packs/") === 0 || h.indexOf("packs?") === 0 || h === "packs") dest = root + "/#" + h;
  else if (h) dest += "/" + h;
  location.replace(dest);
})();
</script>
</head>
<body>
<p>Starter packs now open in the catalog. <a id="go" href="../../../#packs">Continue</a></p>
<script>
document.getElementById("go").setAttribute("href", (location.pathname.indexOf("/api/v1/starter-packs") >= 0 ? location.pathname.slice(0, location.pathname.indexOf("/api/v1/starter-packs")) : "") + "/#packs");
</script>
</body>
</html>
