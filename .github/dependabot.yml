# Dependabot configuration for splunk-monitoring-use-cases.
#
# Ecosystems covered here:
#
#  * github-actions — every workflow in .github/workflows/ pins third-party
#    actions by major-version tag (actions/checkout@v4 etc.).  Dependabot
#    will open weekly PRs when a new minor/patch is published so we keep
#    pace with security fixes (e.g. CVE-2025-3xxxx in actions/checkout)
#    without needing a human to remember to bump.
#
#  * docker — INTENTIONALLY NOT CONFIGURED.  The only container image we
#    reference is ``splunk/splunk:9.4.1`` in the ``services.splunk`` block of
#    .github/workflows/uc-tests.yml.  Dependabot's docker updater only parses
#    Dockerfiles / docker-compose / Kubernetes manifests — it cannot read an
#    image tag out of a GitHub Actions ``services:`` map.  A ``docker`` entry
#    pointed at a repo with no Docker manifest fails every run with
#    "Dependabot encountered an error performing the update", so the entry was
#    removed.  Re-add it only when a real Dockerfile / compose file lands; the
#    Splunk service tag is bumped manually for now.
#
#  * npm — root ``package.json`` / ``package-lock.json`` (site tooling, CI
#    devDependencies, recommender/scorecard tests).
#
#  * pip — Python dependencies under ``mcp/`` (see pip note below).
#
# Pull requests are intentionally kept low-volume:
#
#  * weekly schedule (Mondays 06:00 UTC)
#  * single open PR per ecosystem (avoids review thrash)
#  * grouped by ecosystem so reviewers see one combined update
#
# ``pip`` updates for the MCP server are tracked via the ``package-ecosystem:
# pip`` entry with ``directory: /mcp`` (pyproject.toml, requirements-lock.txt,
# etc.), so dependency PRs stay scoped to that subtree.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github_actions"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    groups:
      npm-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "pip"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "python"
