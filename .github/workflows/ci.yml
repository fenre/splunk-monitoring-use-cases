name: CI

# One catalog build per pull request and per push to main.
#
# The build job writes dist/ once and uploads it. audits-build, mcp,
# frontend and the fixture check download that artifact. lint,
# audits-content, data-sizing and the manifest check do not need dist/
# and start immediately.
#
# Deploy publishes that same artifact and waits only for build. Once
# main has been green for a week, deploy should also need the content
# checks (lint, audits-content, audits-build, mcp, frontend).
#
# CodeQL, SARIF and Lighthouse run weekly. The reproducibility double
# build stays in build-reproducibility.yml. On every Pages deploy,
# Sigstore signs dist/integrity.json and dist/BUILD-INFO.json.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      uc_filter:
        description: 'Glob on UC directory names (e.g. "UC-1.*"). Empty = run all with positive.log.'
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded PR runs. Pushes to main queue instead of cancelling,
# so every landed commit is validated and deploys finish in order.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    outputs:
      uc-count: ${{ steps.summary.outputs.uc_count }}
      build-sha: ${{ steps.summary.outputs.sha }}
    steps:
      - name: Record start
        id: timing
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"
          # The license inventory resolves every declared dependency.
          install-extras: "audits,test,dev"

      - name: Install MCP subpackage (license inventory)
        run: pip install --disable-pip-version-check -e 'mcp/[test]'

      - name: Set up Node.js
        # Root npm ci: axe-core and jsdom for perf + a11y.
        uses: ./.github/actions/setup-node
        with:
          install-deps: "true"

      - name: apps/web — install deps (non-technical-view.js emit)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Restore sidecar quality-score cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sidecar-quality-scores.json
          key: sidecar-quality-${{ hashFiles('content/**/*.json', 'src/splunk_uc/audits/gold_profile.py', 'src/splunk_uc/audits/gold_profile_v2.py') }}
          restore-keys: |
            sidecar-quality-

      # api/v1 generation order is load-bearing (issue #68).
      # generate-api-surface reads dist/catalog.json. build.py mirrors
      # api/ into dist/ and does not populate api/v1 itself. Order:
      # parse+meta, generators, one full build, then compare catalogs.
      - name: Write catalog.json (parse + meta only)
        run: |
          python3 tools/build/build.py --out dist --only parse meta --reproducible
          test -s dist/catalog.json || { echo "::error::dist/catalog.json missing/empty after parse+meta — generators would emit empty api/v1 indexes (issue #68)"; exit 1; }
          cp dist/catalog.json "$RUNNER_TEMP/catalog-parse-meta.json"

      - name: Generate published rollups
        # These files are gitignored. generate-api-surface reads the
        # equipment app map and the compliance coverage report, so this
        # step is before that regeneration. SOURCE_DATE_EPOCH is left
        # unset so a rollup whose body has not changed keeps its
        # published stamp. The full build copies the files into dist/.
        run: make generate-published-rollups

      - name: Regenerate api/v1/
        run: |
          PYTHONPATH=src python3 -m splunk_uc generate-api-surface
          PYTHONPATH=src python3 -m splunk_uc generate-evidence-packs
          PYTHONPATH=src python3 -m splunk_uc generate-starter-packs --validate
          PYTHONPATH=src python3 -m splunk_uc audit-oscal-roundtrip

      - name: Publish dist/ (one full build)
        run: python3 tools/build/build.py --out dist --reproducible

      - name: catalog.json matches the parse+meta output
        run: |
          if ! cmp -s "$RUNNER_TEMP/catalog-parse-meta.json" dist/catalog.json; then
            echo "::error::dist/catalog.json differs from the catalog written by --only parse meta"
            exit 1
          fi

      - name: Guard — api/v1 recommender + equipment indexes are non-empty
        run: python3 tools/audits/api_surface_nonempty.py dist

      - name: Summary
        id: summary
        run: |
          uc_count=$(jq -r '.counts.useCases' dist/BUILD-INFO.json)
          sha=$(jq -r '.git.shortSha' dist/BUILD-INFO.json)
          now=$(date +%s)
          elapsed=$((now - ${{ steps.timing.outputs.start_epoch }}))
          echo "uc_count=$uc_count" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"           >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "## Build summary"            >> "$GITHUB_STEP_SUMMARY"
          echo "- UC count: $uc_count"        >> "$GITHUB_STEP_SUMMARY"
          echo "- git SHA:  $sha"             >> "$GITHUB_STEP_SUMMARY"
          echo "- size:     $(du -sh dist/ | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- duration: %dm %ds (%ds)\n' $((elapsed / 60)) $((elapsed % 60)) "$elapsed" >> "$GITHUB_STEP_SUMMARY"

      - name: Pack catalog build
        # One archive. Uploading dist/ file-by-file spends the time on
        # zip headers for tens of thousands of files.
        run: |
          tar -cf catalog-dist.tar.gz --use-compress-program='gzip -1' \
            dist api/v1 \
            data/equipment-app-map.json \
            data/splunk-version-matrix.json \
            docs/backlinks.md \
            docs/compliance-coverage.md \
            docs/compliance-gaps.md \
            docs/evidence-packs \
            docs/splunk-cloud-compat.md \
            docs/splunk-version-matrix.md \
            reports/attack-simulation.json \
            reports/cisco-coverage \
            reports/compliance-coverage.json \
            reports/compliance-gaps.json \
            reports/oscal-roundtrip.json \
            reports/prerequisites-audit.json \
            reports/sandbox-validation.json \
            splunk-apps/splunk-uc-recommender \
            provenance.json \
            provenance.js \
            docs/provenance-coverage.md \
            scorecard.json \
            docs/scorecard.md \
            docs/samples-coverage.md \
            docs/uc-review-findings.md \
            reports/uc-review/summary.json \
            reports/uc-review/fix-queue.json \
            reports/uc-review/human-lane.md \
            data/license-inventory.json \
            docs/license-inventory.md \
            reports/perf-a11y.json \
            non-technical-view.js

      - name: Upload catalog build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-dist
          retention-days: 1
          compression-level: 0
          path: catalog-dist.tar.gz

      - name: Upload integrity manifest as workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrity-manifest
          path: |
            dist/integrity.json
            dist/BUILD-INFO.json
          retention-days: 90

      # One attestation covers both files. Verifiable with
      #   gh attestation verify dist/integrity.json --owner <owner>
      #   gh attestation verify dist/BUILD-INFO.json --owner <owner>
      - name: Sign integrity manifest and BUILD-INFO (Sigstore via OIDC)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/integrity.json
            dist/BUILD-INFO.json

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # ============================================================================
  # Job 1: lint (~5 min budget)
  # ============================================================================
  # Fast feedback. Stdlib-only Python + tiny ``node -e`` evaluations. No
  # audit dependencies install. No ``npm ci``. When this job fails,
  # something fundamental is wrong with the PR's metadata, version triple,
  # or supply-chain pins. Look at the first failing step — every step is
  # independent.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"

      - name: Set up Node.js
        # Lint only needs Node for the ``node -e`` docs-uc-map.js syntax
        # check. No npm packages are required, so install-deps is
        # intentionally false.
        uses: ./.github/actions/setup-node
        with:
          install-deps: "false"

      - name: Schema metadata validation
        run: python3 tools/audits/schema_meta.py

      - name: Asset drift (inline blocks vs src/)
        run: python3 tools/audits/asset_drift.py

      - name: GitHub Actions pin audit
        # Verifies every ``uses: <action>@<sha> # vX.Y.Z`` reference in
        # ``.github/workflows/*.yml`` and ``.github/actions/*/action.yml``
        # still resolves to the SHA upstream claims under the named tag.
        # Catches three classes of supply-chain attack: comment drift,
        # tag-then-force-push, and homoglyph/typo SHAs. ``GITHUB_TOKEN``
        # raises the unauthenticated API rate limit (60/hour → 5000/hour),
        # so PRs from forks remain hermetic.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=src python3 -m splunk_uc audit-action-pins

      - name: splunk_uc CLI dispatcher smoke
        # P6 (scripts taxonomy, 2026-05-09): the unified
        # ``python -m splunk_uc <verb>`` dispatcher is the canonical
        # entry point for migrated audits + generators. This smoke
        # gate fails the PR if the package skeleton breaks (missing
        # ``__init__.py``, registry-import error, dead verb registration,
        # version-read regression). It is intentionally fast —
        # sub-second — so it sits in the per-PR lane rather than the
        # nightly job.
        run: |
          PYTHONPATH=src python3 -m splunk_uc --help
          PYTHONPATH=src python3 -m splunk_uc --version

      - name: mypy --strict (P4 floor — splunk_uc.*)
        # P4 type-debt-burndown floor (2026-05-13): every module under
        # ``src/splunk_uc/`` passes ``mypy --strict`` with zero errors —
        # 94 source files, ~25 kLOC, every subpackage (audits / generators /
        # ingest / feasibility / migrations / tools) plus the three
        # top-level modules. The package-wide strict override lives in
        # ``pyproject.toml`` under
        # ``[[tool.mypy.overrides]] module = "splunk_uc.*"``, so plain
        # ``mypy`` (no ``--strict`` flag) picks it up. This gate fails
        # the PR on any future drift anywhere in the package — untyped
        # def, implicit Any, un-parameterised generic — keeping the
        # floor from silently regressing into the broader type-debt
        # backlog. The remaining §P4 work is migrating the build
        # pipeline (``tools/build/*``) and the legacy ``build.py``
        # entrypoint into strict-clean territory; both still carry
        # per-module loosened overrides for now.
        run: |
          pip install --disable-pip-version-check "mypy>=1.10" "types-PyYAML>=6.0.12"
          PYTHONPATH=src mypy --no-incremental src/splunk_uc/

      - name: Docs-UC map JS syntax
        run: |
          node -e "
            const vm = require('vm');
            const fs = require('fs');
            const code = fs.readFileSync('docs-uc-map.js', 'utf8');
            const script = new vm.Script(code, { filename: 'docs-uc-map.js' });
            const ctx = vm.createContext({});
            script.runInContext(ctx);
            const n = Object.keys(ctx.DOC_UC_MAP || {}).length;
            const r = Object.keys(ctx.UC_DOC_MAP || {}).length;
            if (n < 1) { console.error('No doc entries found'); process.exit(1); }
            console.log(n + ' doc entries, ' + r + ' reverse UC entries OK');
          "

      - name: Version consistency
        # VERSION / CHANGELOG top / release notes popup must all agree on
        # the latest *released* version. First numbered ``## [N.N]``
        # heading in CHANGELOG.md skips ``[Unreleased]`` (the
        # Keep-a-Changelog staging block for work that has not yet been
        # assigned a release number).
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          CL_VER=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          RN_VER=$(python3 -c "import re; m=re.search(r'<span class=\"rn-version-tag[^\"]*\">([^<]+)</span>', open('index.html').read()); print(m.group(1).strip() if m else '')")
          echo "VERSION file: $VER"
          echo "CHANGELOG top (released): $CL_VER"
          echo "Release notes top: $RN_VER"
          FAIL=0
          if [ -z "$CL_VER" ]; then
            echo "::error::CHANGELOG.md has no numbered release heading (e.g. '## [6.0]')."
            FAIL=1
          fi
          if [ "$VER" != "$CL_VER" ]; then
            echo "::error::VERSION ($VER) does not match CHANGELOG top entry ($CL_VER)"
            FAIL=1
          fi
          if [ "$VER" != "$RN_VER" ]; then
            echo "::error::VERSION ($VER) does not match release notes top entry ($RN_VER)"
            FAIL=1
          fi
          exit $FAIL

      - name: Schema-cycle gate (parallel atlas §3.1)
        # At most one schemas/uc.schema.json bump may land on main per 24-hour
        # merge cycle. A PR that touches the schema while main already
        # received a bump in that window fails closed. PRs that leave the
        # schema alone pass: main's history is not theirs to fix.
        # The PR's own diff is base.sha...head.sha, not the merge ref, and
        # bumps are counted per landed merge (first parent), not per commit.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin main --depth=200
          if ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -qx 'schemas/uc.schema.json'; then
            echo "Schema-cycle gate PASS (this PR does not modify schemas/uc.schema.json)"
            exit 0
          fi
          RECENT=$(git log origin/main --first-parent --since="24 hours ago" --oneline -- schemas/uc.schema.json | wc -l | tr -d ' ')
          echo "Schema bumps landed on main (last 24h): ${RECENT}"
          if [ "${RECENT}" -ge 1 ]; then
            echo "::error::This PR modifies schemas/uc.schema.json but main already had a schema bump in the last 24h. Serialise schema PRs per docs/parallel-execution-substrate.md §3.1."
            exit 1
          fi
          echo "Schema-cycle gate PASS"

      - name: Subagent UC-firewall (Task B-7)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin main --depth=50
          PYTHONPATH=src python3 -m splunk_uc audit-subagent-uc-firewall --check

  # ============================================================================
  # Job 2: audits-content (~25 min budget)
  # ============================================================================
  # UC content audits. Reads sidecars, scripts and reports directly.
  # Steps that need dist/catalog.json run in audits-build, which
  # downloads the artifact from the build job.
  #
  # The 14 cascade-style "generator regeneration check" steps that used
  # to fan out one CI step each were collapsed into a single umbrella
  # step (``Cascade-generator drift gate (umbrella)`` → ``make
  # sync-generated-check``) in PR-2 lean-mode (2026-05-17, drift ledger
  # #20). When the umbrella fails, the log lists every drifting
  # generator; recovery is ``make sync-generated && git add -A``
  # locally.
  #
  # Most other failures in this job are "you edited a JSON sidecar but
  # forgot to regenerate the report" — ``make build`` or the named
  # generator without ``--check`` will fix it.
  audits-content:
    name: audits-content
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so ``tools/audits/schema_diff.py`` can
          # resolve a baseline git ref (see docs/schema-versioning.md).
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"
          # PR-5 hotfix (2026-05-12): the audits-content unit-test pass loads
          # ``tests/scripts/test_equipment_lib_properties.py`` which imports
          # ``hypothesis`` for property-based testing. ``hypothesis`` (and the
          # rest of the test stack: pytest, pytest-cov, pytest-asyncio, respx)
          # is declared in pyproject.toml's ``[test]`` extras. Using the
          # composite's ``install-extras`` input keeps the dependency
          # declaration in pyproject.toml (single source of truth) instead of
          # drifting through inline ``pip install pytest …`` lists. See
          # docs/scripts-taxonomy.md §extras-management.
          # audits + dev: generate-published-rollups writes the license
          # inventory, which resolves every declared dependency.
          install-extras: "audits,test,dev"

      - name: Install MCP subpackage (required by audit-license-inventory)
        # PR-5 hotfix #2 (2026-05-12): ``tests/scripts/test_audit_license_
        # inventory.py`` drives ``splunk_uc.audits.license_inventory.main()``
        # end-to-end. The auditor imports every declared dependency to
        # validate the licence inventory; ``mcp`` is declared in
        # ``mcp/pyproject.toml`` as a runtime dep of the ``splunk-uc-mcp``
        # subpackage and is NOT pulled in by ``pip install -e ".[test]"``
        # against the root pyproject. Without it the audit raises
        #     audit_license_inventory: the following declared dependencies are
        #     not importable in the running interpreter: mcp.
        # …and the three end-to-end tests (write, check-pass, check-drift)
        # fail. Install the MCP subpackage so the auditor's import-check
        # walks every dependency successfully. The mcp job also installs
        # this for its own test suite (different concern, same line).
        run: pip install --disable-pip-version-check -e 'mcp/[test]'

      - name: Set up Node.js
        # generate-published-rollups runs axe-core (root npm ci) and
        # emits non-technical-view.js (apps/web npm ci).
        uses: ./.github/actions/setup-node
        with:
          install-deps: "true"

      - name: apps/web — install deps (non-technical-view.js emit)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Generate published rollups for tests
        # The rollups are gitignored. Unit tests and the roadmap link
        # check read them from the checkout, so they have to exist
        # before pytest. Several read dist/catalog.json.
        run: |
          python3 tools/build/build.py --out dist --only parse meta --reproducible
          make generate-published-rollups

      - name: Unit tests (build pipeline + audits)
        # pyproject.toml's [tool.pytest.ini_options] declares
        # ``asyncio_mode``, so pytest-asyncio must be importable or
        # pytest treats the option as an unknown-config warning →
        # error (filterwarnings = ["error", ...]).
        #
        # Phase 6 closure (2026-05-12): tests under ``tests/build/`` now
        # import the migrated implementations from
        # ``splunk_uc.generators`` (e.g.
        # ``test_import_generate_recommender_app``). Set
        # ``PYTHONPATH=src`` so the package resolves without requiring
        # ``pip install -e .`` here. This mirrors every other splunk_uc
        # invocation in this workflow.
        #
        # Coverage and the per-file budget run nightly in
        # build-reproducibility.yml. With xdist, --cov took 506s here.
        #
        # PR-5 hotfix (2026-05-12): test dependencies (pytest, pytest-cov,
        # pytest-asyncio, hypothesis, respx) are now installed by the
        # ``Set up Python`` step above via ``install-extras: "test"``. The
        # previous inline ``pip install pytest pytest-cov pytest-asyncio``
        # silently dropped ``hypothesis`` and broke property-based tests
        # under ``tests/scripts/``.
        env:
          PYTHONPATH: src
        # Coverage and its per-file budget run nightly. On this
        # runner, pytest-xdist plus --cov took 506s against about a
        # minute without coverage.
        run: pytest tests/build/ tests/scripts/ tests/splunk_uc/ -q -n auto --dist loadscope -m "not nightly"

      - name: UC ID uniqueness and permanent-identity ledger
        run: |
          PYTHONPATH=src python3 -m splunk_uc generate-id-ledger --check
          PYTHONPATH=src python3 -m splunk_uc audit-uc-ids

      - name: UC identifier blast-radius guard
        run: PYTHONPATH=src python3 -m splunk_uc audit-uc-id-migration-blast --check

      - name: UC structure validation (full scan)
        # P6 (scripts taxonomy, 2026-05-09): routed through the
        # ``python -m splunk_uc`` dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-uc-structure --full

      - name: Cost field coverage audit (Lane F, warn-only)
        # Reports ``cost.tier`` coverage across UC sidecars and writes
        # ``dist/audits/cost-coverage.{json,md}``. Threshold starts at 0
        # (warn-only) until Lane N backfills cost metadata by hand; ratchet
        # upward in follow-up PRs as coverage grows.
        run: PYTHONPATH=src python3 -m splunk_uc audit-cost-coverage --check --threshold 0

      - name: Product-fit audit (ADR-0017, warn-only)
        # Lists UCs whose SPL fakes another Splunk product and writes
        # ``dist/audits/product-fit-candidates.json``. ``--check`` fails only
        # on a malformed data/product-fit-rules.json or
        # data/product-fit-review.json; switch to ``--strict`` (fail on
        # unreviewed candidates) once the Phase 3 migrations land.
        run: PYTHONPATH=src python3 -m splunk_uc audit-uc-product-fit --check

      - name: Legacy use-cases/ guard (v8.2.0 retirement)
        # The legacy ``use-cases/cat-*.md`` corpus was retired in
        # v8.2.0 (see docs/migration-status.md). This guard hard-fails
        # if the directory is recreated or if a non-allowlisted
        # tracked file gains a fresh ``use-cases/`` path reference,
        # so the dual-content mess can't reappear by accident.
        # Replaces the v9.x ``audit-legacy-orphans`` verb that
        # diagnosed UCs missing a JSON SSOT sidecar (no longer
        # meaningful now that there is no legacy corpus to be orphaned
        # against).
        run: PYTHONPATH=src python3 -m splunk_uc audit-no-use-cases-dir --check

      - name: SPL grammar linter
        # Flags invalid SPL patterns that the hallucination audit can't
        # catch (stats ... span=, leading pipe on non-generating commands,
        # post-timechart field references, case() with literal wildcards,
        # unbounded join subsearches, etc.). Hardens against regressions
        # surfaced in reports/quality-review/2026-04-18.md.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-spl-grammar --check

      - name: ESCU drill-down SPL
        # A UC whose search is the ESCU "view risk events for $token$"
        # drill-down detects nothing. Unmatched UCs are listed in
        # data/escu-drilldown-backlog.json, which may only shrink.
        run: PYTHONPATH=src python3 -m splunk_uc audit-escu-drilldown-spl --check

      - name: Splunkbase app status
        # On a pull request, only sidecars this PR changes are resolved
        # against the live app API. The full sweep, including backlog
        # staleness for untouched use cases, runs weekly in
        # splunkbase-sync.yml. Known misses stay in
        # data/splunkbase-app-status-backlog.json, which may only shrink.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Full Splunkbase sweep runs weekly (splunkbase-sync.yml)."
            exit 0
          fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- content | grep -E '/UC-.*\.json$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No use-case sidecars changed."
            exit 0
          fi
          args=()
          for f in "${files[@]}"; do args+=(--only "$f"); done
          PYTHONPATH=src python3 -m splunk_uc audit-splunkbase-app-status --check "${args[@]}"

      - name: SPL hallucination audit
        # Flags fabricated command names, non-existent macros, and other
        # LLM-generated SPL that looks plausible but will fail at search
        # time. Runs after the grammar linter so only semantically
        # suspicious patterns are surfaced.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-spl-hallucinations

      - name: Design doc freshness
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-design-doc-freshness

      - name: Regulatory primer freshness
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-regulatory-primer --strict

      - name: Splunkbase catalog freshness
        run: python3 scripts/sync_splunkbase_catalog.py --check

      - name: Splunkbase ID audit (informational)
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-splunkbase-ids || true

      - name: Equipment app map generator drift
        run: PYTHONPATH=src python3 -m splunk_uc generate-equipment-app-map

      - name: Equipment app map audit
        run: PYTHONPATH=src python3 -m splunk_uc audit-equipment-app-map --check

      - name: Cisco tag evidence
        # A cisco_<model> tag must name a sourcetype, index, or macro that
        # model produces, or a CIM data model listed for its add-on, in spl,
        # cimSpl, or the matching splVariants entry.
        run: PYTHONPATH=src python3 -m splunk_uc audit-cisco-tag-evidence --check

      - name: Cisco sourcetype list
        # Searches may name a Cisco sourcetype only when it is on the
        # Splunk IEV supported list. splStatus=example exempts the six
        # products that have no add-on sample events. The backlog of
        # already-unofficial pairs may only shrink.
        run: PYTHONPATH=src python3 -m splunk_uc audit-cisco-sourcetypes --check

      - name: Cisco portfolio coverage report drift
        run: PYTHONPATH=src python3 -m splunk_uc generate-cisco-coverage

      - name: Cisco portfolio coverage ratchet
        run: PYTHONPATH=src python3 -m splunk_uc audit-cisco-coverage --check

      - name: Starter-pack audit
        # Guided onboarding. Errors fail; warnings only block status=published.
        run: PYTHONPATH=src python3 -m splunk_uc audit-starter-packs --check

      - name: Starter-pack API render (hermetic)
        run: PYTHONPATH=src python3 -m splunk_uc generate-starter-packs --check --validate

      - name: Audit — schema diff
        if: always()
        run: |
          set -euo pipefail
          BASELINE_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)"
          if [ -z "${BASELINE_TAG}" ]; then
            echo '::notice::No v* git tags; skipping schema_diff (no baseline ref).'
            exit 0
          fi
          python3 tools/audits/schema_diff.py --baseline-tag "${BASELINE_TAG}"

      - name: Placeholder and scaffolding detector
        # Rejects TODO/FIXME/TBD markers, literal "..." inside SPL,
        # generic "control theme N" titles, editorial section headers,
        # blank known-FP stubs, and other scaffolding artefacts.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        # v8.2.0 (2026-05-10): the audit was migrated to scan the JSON SSOT
        # at content/cat-*/UC-*.json (was use-cases/cat-*.md), and ships a
        # baseline of accepted long-tail content debt at
        # data/audits/placeholders-baseline.json so CI fails only on NEW
        # findings. Refresh the baseline after content cleanup with:
        #   PYTHONPATH=src python3 -m splunk_uc audit-placeholders \
        #     --write-baseline --no-baseline
        run: PYTHONPATH=src python3 -m splunk_uc audit-placeholders --check

      - name: MITRE ATT&CK taxonomy
        # Enforces that MITRE ATT&CK fields contain only Txxxx/TAxxxx
        # tokens. Rejects CVE IDs, URLs, parenthetical prose, and free
        # text that leaked in from mirrored ESCU content.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-mitre-taxonomy --check

      - name: Monitoring-type policy
        # Flags unknown monitoring-type tokens and security UCs with
        # MITRE ATT&CK mappings that are missing the Security tag.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-monitoring-type --check

      - name: CIM ↔ SPL alignment
        # Validates that CIM Models declarations use canonical spellings
        # and that any datamodel= references in CIM SPL blocks match the
        # declared models.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-cim-spl-alignment --check

      - name: Known false positives hygiene
        # Rejects `|` pipe stubs and empty/placeholder values in the
        # Known false positives field — artefacts from bulk imports that
        # leave noise-review guidance missing.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-known-fp --check

      - name: Template provenance report
        # Burndown telemetry for bulk-enricher fingerprints. v1 families are
        # report-only; the v2 families (self-referential UC IDs, Variant N
        # control tests, shared evidence/exclusions skeletons) are capped at
        # the 2026-10-26 baseline. Lower --max-any-v2 as fixes land.
        run: PYTHONPATH=src python3 -m splunk_uc audit-template-provenance --check --max-any-v2 16250

      - name: UC text-quality pre-pass (ratchet)
        # Deterministic review pre-pass (docs/uc-text-review-rubric.md).
        # The cap is the catalogue after the Splunkbase ID corrections
        # (2026-11-04, 16,728 UCs): 132,031 major findings. Lower
        # --max-major after each review-fix-scripted or lift batch.
        run: PYTHONPATH=src python3 -m splunk_uc audit-text-quality --no-write --no-spelling --check --max-blocker 0 --max-major 132031

      - name: UC review ledger schema
        # Every committed review record under reports/uc-review/ must
        # validate against schemas/v2/uc-review-finding.schema.json.
        run: python3 scripts/uc_review_runner.py validate

      - name: Content quality audit (B-6 description/value dimensions)
        # Extends audit-content-quality with heuristic description/value
        # queues while preserving legacy v1 checks. Cap counts legacy
        # violations plus fail-level description/value findings (~8630 after
        # cat-25 variable-depth expansion). Ratchet --max-findings down as Lane N burns down debt.
        # See docs/content-quality-audit.md.
        run: PYTHONPATH=src python3 -m splunk_uc audit-content-quality --check --severity fail --max-findings 12500

      - name: Non-technical view sync
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-non-technical-sync

      - name: CHANGELOG and cross-references
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-changelog-uc-refs

      - name: Auto-generated doc references library
        # Validate data/source-references.json + data/source-mappings.json +
        # data/inline-citation-phrases.json: every mapping resolves to a
        # known source record, every inline phrase ID resolves, no dangling
        # refs. Fast and independent of the per-doc rewrite (which now
        # runs inside the `Cascade-generator drift gate (umbrella)` step
        # below — see PR-2 lean-mode collapse / drift ledger #20).
        run: python3 scripts/generate_doc_references.py --validate-library

      - name: Repository consistency
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-repo-consistency

      - name: Compliance mapping audit (schema + regulations + golden + baseline)
        # Validates every content/cat-*/UC-*.json sidecar against
        # schemas/uc.schema.json, reconciles each compliance[] entry against
        # data/regulations.json, runs the golden tuple set in
        # tests/golden/compliance-mappings.yaml, and enforces the committed
        # baseline in tests/golden/audit-baseline.json.
        #
        # Phase A of the regulation-coverage-gap plan drove the
        # ``clause-grammar`` backlog from 670 findings to zero; Phase F then
        # removed ``clause-grammar`` from ``BASELINEABLE_CODES`` in
        # python3 -m splunk_uc audit-compliance-mappings so it can never be
        # re-baselined even with ``--update-baseline``. Any malformed
        # ``compliance[].clause`` string is now a hard error that blocks
        # merges outright. Only ``equipment-orphan`` remains baselineable;
        # the goal is to keep that backlog shrinking until it hits zero too.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-compliance-mappings

      - name: Compliance audit — baseline drift guard (Phase F)
        # Phase F of the regulation-coverage-gap plan. Double-checks that
        # no ``clause-grammar`` fingerprint has been re-introduced into
        # tests/golden/audit-baseline.json. Even if a future contributor
        # re-adds ``clause-grammar`` to BASELINEABLE_CODES in
        # src/splunk_uc/audits/compliance_mappings.py, this step would still
        # fail CI on any baselined malformed clause. Belt-and-braces for
        # the "new malformed clauses are rejected outright" invariant.
        #
        # Fingerprints produced by
        # ``src/splunk_uc/audits/compliance_mappings.py::Finding.fingerprint``
        # are tab-separated: ``<code>\t<uc_id>\t<path>\t<message>``.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-baseline-clause-grammar-free

      - name: Regulation field alignment (compliance[].regulation labels)
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-regulation-alignment

      - name: NO KBF coverage matrix drift gate
        # Validates data/per-regulation/no-kbf-nve-coverage-expansion.json,
        # UC traceability, and NO KBF ↔ NIS2 dual-mapping assurance policy.
        run: PYTHONPATH=src python3 -m splunk_uc audit-no-kbf-coverage

      - name: Catalogue rollups (regenerate and diff)
        # One place for the committed reports that embed the use-case
        # count: compliance coverage, sandbox validation, ATT&CK
        # simulation, and the Splunk version matrix. A content change
        # that adds or removes a use case rewrites all of them. This
        # step regenerates every one and fails if any committed copy
        # differs, so the content pull request updates them together
        # instead of leaving main red one report at a time.
        # Local recovery: make sync-catalogue-rollups
        # Runs even when an earlier audit failed (!cancelled), so the
        # log shows every stale rollup in one step.
        if: ${{ !cancelled() }}
        run: make sync-catalogue-rollups-check

      # Gold --summary prints the tier mix and exits 0. It gates nothing,
      # so it runs nightly in build-reproducibility.yml.

      # ------------------------------------------------------------------
      # Phase 4.5 / 5.x — signoff + sandbox-validation gates
      # ------------------------------------------------------------------
      # Gates that block merges unless the repository is auditor-ready:
      # peer reviews are recorded, legal reviews are recorded, SME reviews
      # are recorded, the mapping ledger is deterministic, and the sandbox
      # fixtures backing every UC's controlTest are wired correctly.
      # The regulatory change-watch check runs weekly in
      # regulatory-watch.yml: it tracks upstream publishers, which a PR
      # cannot change.
      #
      # The companion Node drift guards (4.5c/d/e/f) live in the
      # ``frontend`` job because they share the npm-installed Node
      # toolchain.
      #
      # See docs/peer-review-guide.md and docs/legal-review-guide.md for
      # the human procedures that produce the signoff files.
      # ------------------------------------------------------------------

      - name: Phase 4.5a peer-review signoff audit
        # src/splunk_uc/audits/peer_review_signoffs.py validates
        # data/provenance/peer-review-signoffs.json against the signoff
        # schema and the semantic invariants documented in
        # docs/peer-review-guide.md (reviewer identity non-empty, UC
        # reference resolves, signoff_date is ISO-8601, git commit is a
        # valid 7+ char hex SHA, etc). Exit 1 on any schema or
        # semantic violation.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-peer-review-signoffs

      - name: Phase 4.5b legal-review signoff audit
        # ``audit-legal-review-signoffs`` validates
        # data/provenance/legal-review-signoffs.json against the legal
        # review schema. Enforces that every regulation with a
        # registered legal advisor has a recent signoff and that the
        # quoted clause language matches what is in data/regulations.json
        # at the pinned version. Exit 1 on any schema or semantic
        # violation.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-legal-review-signoffs

      - name: Phase 5.2 SME-review signoff audit
        # ``audit-sme-review-signoffs`` validates
        # data/provenance/sme-signoffs.json against the SME review
        # schema (schemas/sme-review-signoff.schema.json) and the
        # semantic invariants documented in docs/sme-review-guide.md:
        # outcome-specific required fields (revisions, caveats,
        # rejectionReason), reviewer/commit uniqueness for dual-SME
        # review, fixtureReplayResult self-consistency, UC-sidecar
        # caveat mirroring, and fixture/evidence-pack path existence.
        # Exit 1 on any schema or semantic violation.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-sme-review-signoffs

      - name: Phase 5.4 signed provenance ledger audit
        # ``audit-mapping-ledger`` validates the ledger against
        # schemas/mapping-ledger.schema.json, recomputes the canonicalHash
        # for every entry, recomputes the merkleRoot over the sorted
        # leaves, and performs forward+reverse referential integrity
        # against the current UC sidecars. On PR builds the ledger is
        # signature.state='unsigned' (no --require-signature); release.yml
        # re-runs the audit with --require-signature --verify-signature
        # after stamping and Sigstore attestation.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-mapping-ledger

      - name: Exclusions coverage audit (warn-only)
        # Lane K (2026-05-19): surfaces UCs whose string ``exclusions`` field
        # is missing or below the useful-length threshold. Starts at
        # ``--threshold 0`` (warn-only); ratchet as Lane N backfills sidecars.
        # See docs/exclusions-coverage.md.
        run: PYTHONPATH=src python3 -m splunk_uc audit-exclusions-coverage --check --threshold 0

      - name: SPL anti-pattern audit (high-severity ratchet)
        # Lane B / Lane N queue: flags join, makeresults, random(), search-after-stats,
        # and other style/risk patterns from data/spl-anti-patterns.json. Writes
        # dist/audits/spl-anti-patterns.{json,md} on failure for triage. --limit
        # ratchets down as maintainers burn down the backlog (see docs/spl-anti-patterns.md).
        run: PYTHONPATH=src python3 -m splunk_uc audit-spl-anti-patterns --check --severity high --limit 2060

      - name: Phase C-2 evidence-signatures audit (hermetic)
        # Hermetic fixture gate — no dist/evidence/ required on PR builds.
        run: PYTHONPATH=src python3 -m splunk_uc audit-evidence-signatures --check

      - name: SARIF emit roundtrip smoke (Lane D)
        # Cheap guard: fixture audit JSON → SARIF → audit-sarif --check.
        # Full SARIF generation + Code Scanning upload runs in sarif.yml.
        run: |
          set -euo pipefail
          FIXTURES=tests/fixtures/sarif
          OUT=/tmp/sarif-smoke
          mkdir -p "$OUT"
          PYTHONPATH=src python3 -m splunk_uc generate-sarif \
            --out "$OUT" \
            --report "spl-references=$FIXTURES/spl-references.json" \
            --report "prerequisites=$FIXTURES/prerequisites.json" \
            --report "content-quality=$FIXTURES/content-quality.json"
          PYTHONPATH=src python3 -m splunk_uc audit-sarif --check --sarif "$OUT/catalogue.sarif"
          PYTHONPATH=src python3 -m splunk_uc generate-sarif --check \
            --out "$OUT" \
            --report "spl-references=$FIXTURES/spl-references.json" \
            --report "prerequisites=$FIXTURES/prerequisites.json" \
            --report "content-quality=$FIXTURES/content-quality.json"

      # ----- audits-content artefact uploads -----

      - name: Upload compliance audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compliance-coverage
          path: reports/compliance-coverage.json
          if-no-files-found: ignore

      - name: Upload clause-level gap report
        # Phase 2.1 deliverable. Reviewers can pull the artifact to triage
        # gap worklists without regenerating locally.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compliance-gaps
          path: reports/compliance-gaps.json
          if-no-files-found: ignore

      - name: Upload prerequisite graph audit report
        # Implementation-ordering audit (wave/prereq graph). Reviewers
        # can download this artifact to inspect the full dependency
        # graph, wave distribution, and any warnings without re-running
        # ``python -m splunk_uc audit-prerequisites`` locally.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prerequisites-audit
          path: reports/prerequisites-audit.json
          if-no-files-found: ignore

      - name: CODEOWNERS coverage audit (warn-only threshold 0)
        # Cross-check .github/CODEOWNERS against ``git ls-files`` and
        # surface tracked paths with no owner. Starts at --threshold 0
        # (never blocks); ratchet upward as path-specific rules land.
        # See docs/codeowners-coverage.md for the maintainer workflow.
        env:
          PYTHONPATH: src
        run: |
          python3 -m splunk_uc audit-codeowners-coverage --check --threshold 0

      - name: Catalogue observability metrics (Lane L)
        # Emits dist/observability/{freshness,quality,coverage}.json and
        # catalogue.prom, then validates shape/bounds. --limit 200 keeps
        # PR CI fast; nightly build-reproducibility can run without --limit.
        run: |
          PYTHONPATH=src python3 -m splunk_uc generate-observability-metrics --limit 200
          PYTHONPATH=src python3 -m splunk_uc audit-observability-drift --check

      - name: Drift summary (on failure)
        # Surfaces the recovery hint in the run's Job Summary so a red
        # drift/audit run shows the fix at the TOP of the page instead of
        # buried in step logs. Fires only when an earlier step in this job
        # failed; pairs with the un-masked ``if: ${{ !cancelled() }}`` gates
        # so all stale artefacts surface in one run.
        if: ${{ failure() }}
        shell: bash
        run: bash .github/scripts/drift-summary.sh "${{ github.job }}"

  # ============================================================================
  # Job 3: audits-build (~30 min budget)
  # ============================================================================
  # Downloads the catalog artifact from the build job. Does not run
  # tools/build/build.py. When this job fails, the most common cause is
  # a missing regeneration commit. URL freeze and byte budget failures
  # usually mean a deliberate URL change or asset bloat — see
  # docs/external-consumer-matrix.md for the URL stability contract.
  audits-build:
    name: audits-build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so ``tools/audits/url_freeze.py`` can
          # resolve a baseline tag.
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"

      - name: Set up Node.js
        # Node is needed by the Phase 3 / Phase 5 story-layer smoke tests
        # which run ``node tools/audits/_phase3*_smoke.js`` and
        # ``_phase5_primer_smoke.js`` against the freshly-built
        # ``dist/catalog.json`` and ``api/v1/`` tree. Pure stdlib Node,
        # no npm dependencies, so install-deps is intentionally false.
        uses: ./.github/actions/setup-node
        with:
          install-deps: "false"

      - name: Download catalog build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-dist
          path: .
      - name: Unpack catalog build
        run: tar -xzf catalog-dist.tar.gz && rm -f catalog-dist.tar.gz

      - name: Auto-generated docs provenance
        # Reads the rollups unpacked from the catalog artifact. Those
        # files are generated in the build job and are not in git.
        run: python3 scripts/audit_auto_gen_provenance.py --check

      - name: Catalog schema validation
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-catalog-schema

      - name: Cascade-generator drift gate (umbrella)
        # PR-2 lean-mode collapse (2026-05-17, drift ledger #20). One
        # umbrella step replaces 14 cascade-style per-generator --check
        # gates that used to fan out one CI step each. 2026-05-18 (F21
        # close) retired ``generate-md-from-json`` — the in-tree
        # ``content/cat-*/UC-*.md`` companions were deleted and the
        # umbrella now drives 13 generators instead of 14. 2026-05-27
        # restored a 14th step (``generate-recommender-app --check``)
        # after a release-day drift miss: the
        # ``splunk-apps/splunk-uc-recommender/`` tree (5 files: README,
        # app.manifest, app.conf, catalog-fallback.json, the static
        # lookup CSV) stamps the catalogue ``VERSION`` and release date,
        # but the regenerator was never inside ``sync-generated`` so
        # version bumps silently drifted until the ``Validate catalog``
        # step in audits-build caught it post-push.
        #
        # `make sync-generated-check` runs the same 14 generators with
        # --check flags in dependency-safe order:
        #   1. phase3-1 / phase3-2 / phase3-3 (sidecar compliance[])
        #   2. equipment-tags (sidecar equipment[]/equipmentModels[])
        #   3. grandma-explanations (sidecar grandmaExplanation)
        #   4. migrate-cat22-ntv (non-technical-view.js cat-22 block)
        #   5. audit-prerequisites (reports/prerequisites-audit.json)
        #   6. audit-compliance-gaps (reports/compliance-gaps.json +
        #      docs/compliance-gaps.md)
        #   7. audit-sandbox-validation (reports/sandbox-validation.json)
        #   8. generate-evidence-packs (docs/evidence-packs/* +
        #      api/v1/evidence-packs/*)
        #   9. generate-mapping-ledger (data/provenance/mapping-ledger.json)
        #  10. generate-recommender-app (splunk-apps/splunk-uc-recommender/
        #      tree — version/release-date stamps + catalog fallback)
        #  11. generate-backlinks (docs/backlinks.md)
        #  12. generate-doc-references (APA References footer + inline
        #      [N] markers in every .md)
        #
        # Each generator is idempotent — a forgotten regeneration, a
        # hand-edited derivative artefact, or a stale manifest entry all
        # fail this gate. On failure, the local recovery procedure is:
        #
        #   make sync-generated && git add -A && git diff --staged
        #
        # The umbrella runs the generators in a single shell with `set
        # -e` overridden so every drift surface appears in one log
        # (rather than stopping at the first failure). The Makefile
        # target collects per-step failures, prints DRIFT lines, and
        # exits 1 once all 14 have run.
        #
        # Generators that need `dist/catalog.json` (audit-prerequisites,
        # audit-compliance-gaps, audit-sandbox-validation) read it
        # from the catalog artifact downloaded above. Generators that only
        # read sidecars are catalog-independent but live in the same
        # umbrella for one-stop drift recovery.
        #
        # `generate-api-surface --check` is intentionally excluded — it
        # lives in the audits-build job because it consumes the full
        # post-build dist/ tree.
        run: make sync-generated-check

      - name: Story-layer UI smoke tests
        # Node.js headless shims exercise the JS in index.html,
        # clause-navigator.html, compliance-story.html and
        # regulatory-primer.html so regressions in the regulation-to-UC
        # story surfaces (Phase 3a/3b/3c, Phase 5 primer autolinker) are
        # caught in CI. These tests ship no external dependencies and
        # read the generated api/v1/ tree (3b/3c/5) plus
        # dist/catalog.json (3a, post-v8.2.0).
        run: |
          node tools/audits/_phase3a_smoke.js
          node tools/audits/_phase3b_smoke.js
          node tools/audits/_phase3c_smoke.js
          node tools/audits/_phase5_primer_smoke.js
          node tools/audits/starter_plan_parity.js

      - name: Splunk UC Recommender generator regeneration check
        if: ${{ !cancelled() }}
        # The ``generate-recommender-app`` verb is the single source of
        # truth for splunk-apps/splunk-uc-recommender/. --check
        # regenerates the tree into a tempdir and diffs it against the
        # committed tree, so a forgotten regeneration (or any
        # non-deterministic output from the generator itself) fails
        # CI before the app is shipped to operators. (The companion
        # splunk-uc-recommender-ta tree was deleted in v8.0.0; the
        # recommender app is now standalone.)
        # P6 (scripts taxonomy, 2026-05-10): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc generate-recommender-app --check

      - name: Audit — api/v1 recommender + equipment indexes are non-empty
        # Regression guard for issue #68 (2026-06-03). The preceding build
        # mirrors the generated (and populated) api/v1/ tree into dist/, so
        # at this point dist/ matches the production publish state. If a
        # future change ever reorders the build so generate-api-surface runs
        # before dist/catalog.json exists, _load_catalog() returns [] and the
        # recommender/equipment indexes ship empty (HTTP 200, zero records).
        # This audit fails the PR here instead of letting that reach Pages.
        if: ${{ !cancelled() }}
        run: python3 tools/audits/api_surface_nonempty.py dist

      - name: Audit — byte budgets
        if: ${{ !cancelled() }}
        run: python3 tools/audits/budgets.py --dist dist --json

      - name: Audit — URL freeze
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          BASELINE_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)"
          if [ -z "${BASELINE_TAG}" ]; then
            echo '::notice::No v* git tags; skipping url_freeze (no baseline manifest ref).'
            exit 0
          fi
          python3 tools/audits/url_freeze.py --baseline-tag "${BASELINE_TAG}" --head dist/api/manifest.json

      - name: Prerequisite audit report (post-build drift)
        if: ${{ !cancelled() }}
        # After the build regenerates catalog.json, re-run the prereq
        # audit's --check so the committed report stays in lockstep with
        # the freshly regenerated catalogue. This is a belt-and-braces
        # guard: the audit already ran on the pre-build catalog in
        # ``audits-content``, but if the build re-derived a different
        # graph (e.g. someone edited the markdown without regenerating
        # the report), this catches it.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-prerequisites --check

      - name: Quality metadata coverage (warn-only)
        if: ${{ !cancelled() }}
        # Reports coverage of References, Known false positives, Status,
        # Last reviewed, Splunk versions and Reviewer fields. Runs after
        # ``build.py`` so catalog.json is fresh. Currently warn-only;
        # switch to --strict once the non-mandatory fields are broadly
        # populated (tracked by the Gold Standard roadmap, v5.2).
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-quality-metadata

      - name: Splunk Cloud compatibility audit
        if: ${{ !cancelled() }}
        # Scans every UC's SPL and every packaged .conf for patterns that
        # fail Splunk Cloud vetting (custom commands, scripted inputs,
        # deprecated SPL, etc.). Regenerates docs/splunk-cloud-compat.md
        # and test-results/splunk-cloud-compat.json. Fails on any
        # severity=fail; warn-only results are surfaced in the job log.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-splunk-cloud-compat

      - name: Splunk Cloud audit — generated report is committed
        if: ${{ !cancelled() }}
        run: |
          CHANGED=$(git diff --name-only -- docs/splunk-cloud-compat.md)
          if [ -n "$CHANGED" ]; then
            echo "::error::docs/splunk-cloud-compat.md is out of date — run \`python -m splunk_uc audit-splunk-cloud-compat\` and commit"
            git --no-pager diff --stat -- docs/splunk-cloud-compat.md
            exit 1
          fi

      - name: Splunk version-matrix audit (P18)
        if: ${{ !cancelled() }}
        # 2-D rollup of every UC's ``splunkVersions`` declarations vs.
        # the canonical vocabulary in
        # ``data/splunk-version-vocabulary.json``. ``--check`` exits
        # non-zero on any unknown-token finding, blocking the PR
        # rather than silently regenerating an artefact in CI.
        # ``--check`` skips the write. Freshness of
        # ``data/splunk-version-matrix.json`` and
        # ``docs/splunk-version-matrix.md`` is the catalogue-rollups
        # step in audits-content (``make sync-catalogue-rollups-check``).
        run: PYTHONPATH=src python3 -m splunk_uc audit-splunk-version-matrix --check

      - name: Generate RAG chunked corpus (P17)
        if: ${{ !cancelled() }}
        # Walks every ``dist/uc/UC-*/uc.md`` produced by the build and
        # emits the LLM-eval-ready chunked corpus under ``dist/rag/``:
        # one frontmatter-stamped chunk per markdown section + the
        # ``manifest.json`` + ``manifest.md`` rollup. ``dist/`` is
        # gitignored, so the artefact is rebuilt fresh on every CI
        # run. The determinism rerun (``--check``) is nightly, in
        # build-reproducibility.yml. This step still generates the
        # corpus the retrieval-eval gate reads.
        run: PYTHONPATH=src python3 -m splunk_uc generate-rag-chunks

      - name: Retrieval-eval drift gate (P17 wave D)
        if: ${{ !cancelled() }}
        # Runs the curated 30-query BM25 retrieval-eval harness
        # over the chunked corpus produced by the previous step
        # and drift-guards the aggregate metrics (mean recall@k,
        # MRR, nDCG@10) against the frozen baseline at
        # ``data/baselines/retrieval-eval-v1.0.json``. Tolerance
        # defaults to 2% relative regression with a 0.01 absolute
        # floor so floating-point noise across Python releases
        # doesn't fail the gate.
        run: |
          PYTHONPATH=src python3 -m splunk_uc audit-retrieval-eval --check

      - name: Alert actions generator drift (Task H-4)
        if: ${{ !cancelled() }}
        run: |
          PYTHONPATH=src python3 -m splunk_uc generate-alert-actions --check --limit 20

      - name: Package recommender .spl
        if: ${{ !cancelled() }}
        # Builds the deployable ``splunk-uc-recommender-vX.Y.Z.spl``
        # bundle (plus ``.sha256`` + ``SHA256SUMS.txt`` +
        # ``splunk-apps-manifest.md``) from the regenerated
        # ``splunk-apps/`` tree. Runs on every PR + push so operators
        # can install the latest recommender without waiting for a
        # release tag. The same script is invoked by ``release.yml``
        # for tagged release artefacts.
        run: scripts/package_splunk_apps.sh dist/

      # ----- audits-build artefact uploads -----

      - name: Upload Splunk Cloud audit JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: splunk-cloud-compat
          path: test-results/splunk-cloud-compat.json
          if-no-files-found: ignore

      - name: Upload API surface (for PR review)
        # Makes the generated /api/v1/ tree available as a downloadable
        # artifact on every CI run. Reviewers can diff the artifact against
        # the committed tree to triage API drift regressions. See
        # docs/api-versioning.md for the governance policy.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-v1
          path: api/v1/
          if-no-files-found: ignore

      - name: Upload Splunk app tree (for AppInspect / PR review)
        # Makes the generated splunk-apps/ tree available as a
        # downloadable artifact on every CI run. Reviewers can grab a
        # single app and push it through AppInspect or a test Splunk
        # Cloud tenant without having to regenerate locally.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: splunk-apps
          path: splunk-apps/
          if-no-files-found: ignore

      - name: Upload recommender .spl bundle
        # Phase 1 deliverable. Operators can install the recommender
        # from this artifact without waiting for a release tag. The
        # release workflow re-builds + re-uploads the same bundle for
        # tagged releases (with Sigstore attestation).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: splunk-uc-recommender-spl
          path: |
            dist/splunk-uc-recommender-*.spl
            dist/splunk-uc-recommender-*.sha256
            dist/SHA256SUMS.txt
            dist/splunk-apps-manifest.md
          if-no-files-found: ignore

      - name: Drift summary (on failure)
        # See audits-content for rationale. audits-build is the job that
        # runs the full build + byte-budget / URL-freeze / API-surface /
        # Splunk-Cloud drift gates, so its red runs benefit most from a
        # single recovery block in the Job Summary.
        if: ${{ failure() }}
        shell: bash
        run: bash .github/scripts/drift-summary.sh "${{ github.job }}"

  # ============================================================================
  # Job 4: mcp (~10 min budget)
  # ============================================================================
  # Decoupled from the other jobs because ``mcp/`` has its own
  # ``pyproject.toml`` and editable install path. Regenerates the api/v1
  # tree locally (~5s) rather than depending on ``audits-build``.
  # When this job fails, an MCP-only change broke a tool's
  # ``outputSchema``. The drift guard names the offending tool + field.
  mcp:
    name: mcp
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"

      - name: Download catalog build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-dist
          path: .
      - name: Unpack catalog build
        run: tar -xzf catalog-dist.tar.gz && rm -f catalog-dist.tar.gz

      - name: Install MCP server (splunk-uc-mcp) for drift guard + tests
        # Phase 6 deliverable. The MCP server (mcp/) exposes the
        # api/v1 catalogue to LLM agents over JSON-RPC stdio. The
        # drift guard and unit tests both require the package
        # installed in editable mode so ``import splunk_uc_mcp``
        # resolves from the sources.
        run: pip install --disable-pip-version-check -e 'mcp/[test]'

      - name: MCP server unit tests
        # Phase 6 deliverable. The 291-test suite exercises every
        # tool (search_use_cases, get_use_case, list_categories,
        # list_regulations, get_regulation, list_equipment,
        # get_equipment, find_compliance_gap), every URI resource
        # (uc://, reg://, equipment://, ledger://), catalog
        # loading (local-first, HTTPS fallback, path traversal,
        # SSRF protection, payload caps), and the JSON-RPC
        # server handshake itself. Must be green before the drift
        # guard runs — a failing test almost certainly indicates
        # a real drift between the MCP surface and the api/v1
        # JSON files.
        run: python3 -m pytest mcp/tests -q --cov=splunk_uc_mcp --cov-report=term-missing --cov-fail-under=70

      - name: MCP tool schema drift guard
        # Phase 6 deliverable. src/splunk_uc/audits/mcp_tool_schemas.py
        # exercises every MCP tool against the committed
        # api/v1/*.json tree and validates each response against
        # the tool's declared outputSchema. If someone renames a
        # field in api/v1 without updating the tool schema (or
        # vice versa) the MCP server would silently start
        # returning "Output validation error" to every client —
        # this drift guard catches that in CI. The guard also
        # asserts the tool list is complete (8 tools), every
        # tool has descriptions + schemas, the slug regex set is
        # frozen, and api/v1/manifest.json still exposes the
        # endpoint URLs the remote-fallback catalogue depends on.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-mcp-tool-schemas

  # ============================================================================
  # Job 5: frontend (~15 min budget)
  # ============================================================================
  # Render-tier and Phase 4.5 drift-guard tests. The Python ``--check``
  # halves of the Phase 4.5d/e/f gates run here too because they share
  # the npm-installed Node deps (jsdom, ajv, axe-core) and the freshly
  # built ``dist/`` tree.
  # When this job fails: UI / render regression. The Node tests boot
  # the inline ``<script>`` from the page under jsdom — most failures
  # are a missing field in a JSON source feed (regenerate the upstream
  # report) or an introduced XSS sink (innerHTML, eval, document.write).
  # The Python ``--check`` halves diff against the committed
  # ``reports/*.json`` — drift is usually a missed regeneration.
  frontend:
    name: frontend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"

      - name: Set up Node.js
        # Node is required by (a) the recommender + scorecard drift
        # guards and (b) the Phase 4.5 QA gates: sandbox, ATT&CK,
        # OSCAL round-trip, and axe-core perf+a11y. ``npm ci`` is
        # required because the Node tests import jsdom (render
        # tests), ajv (OSCAL round-trip), and @axe-core/* (perf+a11y).
        uses: ./.github/actions/setup-node
        with:
          install-deps: "true"

      - name: Download catalog build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-dist
          path: .
      - name: Unpack catalog build
        run: tar -xzf catalog-dist.tar.gz && rm -f catalog-dist.tar.gz

      - name: Non-technical view JS syntax
        # non-technical-view.js is generated in the build job.
        run: |
          node -e "
            const vm = require('vm');
            const fs = require('fs');
            const code = fs.readFileSync('non-technical-view.js', 'utf8');
            const script = new vm.Script(code, { filename: 'non-technical-view.js' });
            const ctx = vm.createContext({ window: {} });
            script.runInContext(ctx);
            const n = Object.keys(ctx.window.NON_TECHNICAL || {}).length;
            if (n < 1) { console.error('No categories found'); process.exit(1); }
            console.log(n + ' categories OK');
          "

      - name: Recommender frontend unit tests
        # Drift/QA gate: ``!cancelled()`` lets every frontend gate report
        # in one CI round-trip. The prerequisite build + api/v1 gen +
        # ``npm ci`` steps above stay fail-fast.
        if: ${{ !cancelled() }}
        # Node --test runs tests/recommender/match.test.mjs which
        # loads the generated recommender.js under node:vm and
        # exercises the scoring and URL-sanitiser helpers. This
        # catches scoring regressions and XSS drift without needing
        # a live Splunk search head.
        run: node --test tests/recommender/match.test.mjs

      - name: apps/web — install scaffold deps
        # P5 first-migration follow-on (2026-05-16). The
        # apps/web/ tree is the typed companion home for the
        # frontend rebuild ratified by ADR-0013. ``npm ci`` is
        # required because the scaffold pins Vite + Vitest +
        # TypeScript at exact lockfile versions and the test
        # harness imports vitest's jsdom environment. Cold install
        # is ~10s; the cache hit on subsequent runs is faster.
        # No CI-side caching here yet — the install is small
        # enough that adding actions/cache machinery is premature
        # (matches the same restraint the root ``npm ci`` uses).
        working-directory: apps/web
        run: npm ci

      - name: apps/web — typecheck (tsc --noEmit, strict)
        if: ${{ !cancelled() }}
        # Strict TypeScript typecheck against the apps/web/ tree.
        # The tsconfig.json there enables noUncheckedIndexedAccess,
        # exactOptionalPropertyTypes, verbatimModuleSyntax and the
        # standard --strict bundle. This is the frontend twin of
        # the ``mypy --strict`` floor that ``audits-content``
        # enforces on src/splunk_uc/ — same intent (catch type
        # drift at compile time), different toolchain.
        working-directory: apps/web
        run: npm run typecheck

      - name: apps/web — Vitest shape invariants over non-technical-view.js
        if: ${{ !cancelled() }}
        # First real consumer of the apps/web/ scaffold. The
        # vitest suite under apps/web/src/__tests__/ loads the
        # legacy non-technical-view.js via node:vm in a jsdom
        # environment and asserts:
        #   * categories 1..23 with no gaps and no extras
        #   * every area has name + description + 1..10 UCs
        #   * every UC reference is shaped X.Y.Z and has a
        #     non-empty `why` string, and the category prefix of
        #     the UC id matches its declaring category number
        #   * every cat-22 area carrying an evidencePack also
        #     carries the four other Phase 4.3 elevation fields
        #     (whatItIs / whoItAffects / splunkValue / primer)
        #     per .cursor/rules/non-technical-sync.mdc
        # Plus the SOT-inversion suite (2026-05-17): asserts the
        # typed NON_TECHNICAL export deep-equals the legacy-loaded
        # catalog, and the emitter's renderLegacy() output is
        # byte-identical to the on-disk non-technical-view.js.
        # The deeper "every UC id resolves to a real catalogue
        # entry" cross-check stays in the Python audit
        # ``audit-non-technical-references`` (audits-content) so
        # the Node side never re-walks the 7,929 sidecars.
        working-directory: apps/web
        run: npm test

      - name: apps/web — non-technical-view.js SOT drift guard
        if: ${{ !cancelled() }}
        # P5 / F16 source-of-truth inversion (2026-05-17). The
        # canonical surface for the non-technical catalogue is now
        # ``apps/web/src/data/non-technical-view.data.ts`` and the
        # repo-root ``non-technical-view.js`` is a generated artefact
        # emitted by ``apps/web/scripts/emit-legacy.ts`` via
        # ``npm run emit:legacy``. This step regenerates the legacy
        # JS from the typed source and fails the build if it drifts
        # from the checked-in file. Mirrors the pattern used by the
        # Python freshness gates (``--check`` guards) but for the
        # frontend half of the catalogue. Contributors should run
        # ``cd apps/web && npm run emit:legacy`` after any edit to
        # ``src/data/non-technical-view.data.ts``. The file is no longer
        # committed: this re-emits it and compares with the copy the
        # build job published, after the cat-22 block is rewritten.
        working-directory: apps/web
        run: |
          cp ../../non-technical-view.js "$RUNNER_TEMP/ntv-built.js"
          npm run emit:legacy
          cd ../..
          PYTHONPATH=src python3 -m splunk_uc migrate-cat22-ntv
          cmp non-technical-view.js "$RUNNER_TEMP/ntv-built.js"

      - name: Phase 4.4 scorecard.html render test
        if: ${{ !cancelled() }}
        # Phase 4.4 deliverable. scorecard.html boots client-side
        # JavaScript that fetches reports/compliance-coverage.json,
        # reports/compliance-gaps.json, scorecard.json, and
        # data/regulations.json, and renders the full auditor-facing
        # scorecard panel. tests/scorecard/render.test.mjs boots the
        # inline <script> under node:vm against a minimal DOM shim and
        # a filesystem-backed fetch() stub — it asserts that the global
        # rollup metrics, tier grid, per-regulation tbody, per-category
        # tbody, grade distribution, and findings grid all populate
        # from the real JSON sources, and it fails fast if the inline
        # script ever introduces an obvious XSS sink (document.write,
        # eval, un-escaped innerHTML). This is the drift guard for
        # scorecard.html — without it the page could silently fail
        # against a regenerated report and nobody would notice until
        # an auditor opened the page.
        run: node --test tests/scorecard/render.test.mjs

      - name: Phase 4.5c sandbox validation Node drift guard
        if: ${{ !cancelled() }}
        # Independent structural check: tests/sandbox/validate.test.mjs
        # parses reports/sandbox-validation.json and asserts that
        # every UC sidecar with a controlTest block has exactly one
        # record, the record status is one of the known enum values,
        # and the report is canonically serialised. Runs even if
        # Python is unavailable locally (pure Node). The Python
        # ``audit-sandbox-validation --check`` half runs in
        # ``audits-content``.
        run: node --test tests/sandbox/validate.test.mjs

      - name: Phase 4.5d ATT&CK simulation gate
        if: ${{ !cancelled() }}
        # scripts/simulate_controltest.py is a structural simulator —
        # it does NOT run SPL against a live Splunk. It verifies
        # (a) every ATT&CK technique cited by a controlTest parses as
        # the canonical T####[.###] grammar, (b) every such technique
        # exists in the normalised MITRE crosswalk, and (c) populated
        # fixtures have coherent positive/negative polarity. The
        # --check step re-runs the simulator in memory and diffs
        # against reports/attack-simulation.json so drift fails CI.
        run: python3 scripts/simulate_controltest.py --check

      - name: Phase 4.5d ATT&CK simulation Node drift guard
        if: ${{ !cancelled() }}
        # tests/attack/simulate.test.mjs is the Node-only twin of the
        # ATT&CK simulator: it walks the UC sidecars and asserts the
        # committed reports/attack-simulation.json has one record per
        # controlTest, every technique matches T####[.###], the
        # summary counts reconcile with the record set, and the
        # payload is canonically sorted.
        run: node --test tests/attack/simulate.test.mjs

      - name: Phase 4.5e OSCAL round-trip gate
        if: ${{ !cancelled() }}
        # python3 -m splunk_uc audit-oscal-roundtrip validates every
        # api/v1/oscal/component-definitions/*.json against the NIST
        # OSCAL JSON schema (via ajv under the hood) and asserts that
        # parse → re-serialise produces the exact same bytes as the
        # committed file. --check re-runs the audit in memory and
        # diffs reports/oscal-roundtrip.json so any NIST schema drift,
        # regeneration miss, or hand-edit blocks merges.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-oscal-roundtrip --check

      - name: Phase 4.5e OSCAL round-trip Node drift guard
        if: ${{ !cancelled() }}
        # tests/oscal/roundtrip.test.mjs uses @splunk-free ajv to
        # re-validate a sampled subset of the component-definitions
        # against the NIST schema bundled under
        # tools/vendor/oscal/schema/. This catches regressions where
        # a contributor edits a generator without regenerating the
        # report, or where the NIST schema copy drifts from upstream.
        run: node --test tests/oscal/roundtrip.test.mjs

      - name: Phase 4.5f perf + a11y audit gate
        if: ${{ !cancelled() }}
        # audit-perf-a11y enforces two dimensions: per-file
        # byte budgets on critical-path + generated-data assets, and
        # axe-core v4 accessibility audits (WCAG 2.1 A + AA +
        # best-practice) run under jsdom against scorecard.html and
        # index.html. Serious / critical a11y violations hard-fail
        # unless allowlisted with peer review. --check diffs the
        # regenerated report against reports/perf-a11y.json so drift
        # (over-budget file, new violation, stale report) fails CI.
        # P6 (scripts taxonomy, 2026-05-09): routed through the dispatcher.
        run: PYTHONPATH=src python3 -m splunk_uc audit-perf-a11y --check

      - name: Phase 4.5f perf + a11y Node drift guard
        if: ${{ !cancelled() }}
        # tests/a11y/perfa11y.test.mjs asserts
        # reports/perf-a11y.json's top-level shape, that every perf
        # budget's actual_bytes matches the on-disk size, that every
        # a11y page in pages_audited exists on disk, that violation
        # dispositions reconcile with hard_failures + warnings, and
        # that the payload is canonically serialised.
        run: node --test tests/a11y/perfa11y.test.mjs

      - name: Vendor changelog freshness gate (J-5 Cisco v1)
        if: ${{ !cancelled() }}
        # audit-vendor-changelog validates hand-curated vendor release
        # notes under data/vendor-changelog/, checks schema + freshness,
        # and scans UC SPL for renamed/removed vendor fields. v1 is
        # Cisco-only; other vendors land in follow-up PRs.
        run: PYTHONPATH=src python3 -m splunk_uc audit-vendor-changelog --check --max-age-days 180

      # ----- frontend artefact upload -----

      - name: Upload Phase 4.5 QA reports
        # Bundles the machine-readable reports produced by the Phase
        # 4.5 QA gates — sandbox validation, ATT&CK simulation, OSCAL
        # round-trip, and perf+a11y — into a single artifact. Peer
        # and legal signoff files are also included (read from the
        # repo; produced by ``audits-content``) so external reviewers
        # can pull one artifact and reproduce the gate's decision
        # without having to clone the repo. The Phase 5.4
        # mapping-ledger is included as the single canonical provenance
        # artefact; reviewers recomputing the merkle root against this
        # file (or the release-stamped copy in dist/) can verify that
        # every clause-level mapping is attested and that no mapping
        # was added outside the approval flow.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa-gates
          path: |
            reports/sandbox-validation.json
            reports/attack-simulation.json
            reports/oscal-roundtrip.json
            reports/perf-a11y.json
            data/provenance/peer-review-signoffs.json
            data/provenance/legal-review-signoffs.json
            data/provenance/sme-signoffs.json
            data/provenance/mapping-ledger.json
            data/regulations-watch.json
            reports/regulatory-change-watch.json
          if-no-files-found: ignore

      - name: Per-UC dashboard scaffold gate (Lane H)
        if: ${{ !cancelled() }}
        # generate-dashboards emits dist/dashboards/UC-X.Y.Z/{simple,studio}.xml
        # pairs that query real index=/sourcetype= tokens from each UC sidecar SPL
        # (never | makeresults). audit-dashboards --check validates XML + JSON,
        # SPL anti-patterns, pipe-per-line, splunk.* viz types, and determinism.
        run: |
          PYTHONPATH=src python3 -m splunk_uc generate-dashboards
          PYTHONPATH=src python3 -m splunk_uc audit-dashboards --check

      - name: Drift summary (on failure)
        # See audits-content for rationale. frontend runs the Phase 4.5
        # Node drift guards (scorecard / sandbox / ATT&CK / OSCAL / perf+a11y)
        # and the non-technical-view.js SOT guard, all un-masked, so a red
        # run can carry several independent drift failures at once.
        if: ${{ failure() }}
        shell: bash
        run: bash .github/scripts/drift-summary.sh "${{ github.job }}"

  data-sizing-catalogue:
    # 2026-05-27 (Realism refresh — Tasks 5, 11–35, 36, 39): gates the v2
    # data-sizing catalogue. Runs three independent checks:
    #   1. Schema validation of every source object in
    #      tools/data-sizing/ot-data-sources.js against
    #      tools/data-sizing/schemas/data-source.schema.json.
    #   2. Node unit tests under tools/data-sizing/__tests__/. The
    #      *.test.js glob picks up:
    #        - compute-functions.test.js (legacy v1 functions plus the
    #          25 vendor-cited compute functions calibrated at v8.7.0
    #          launch — Palo Alto NGFW, Fortinet, Cisco Secure
    #          Firewall, EDR, Cyber Vision, ISE, WAF, IPS/IDS,
    #          Cloud IaaS, M365, SSO, Windows/Linux server families,
    #          databases, web servers, NetFlow, Meraki, load balancers,
    #          VPN, OPC UA, Modbus, MQTT, BACnet, SNMP)
    #        - catalogue-snapshot.test.js (regression guard: freezes
    #          the {eps, bytesPerEvent} tuple every source produces
    #          under the "typical" profile; regenerate via
    #          tools/data-sizing/scripts/generate-snapshot.js).
    #        - headless-smoke.test.js (the automatable subset of the
    #          release-time browser smoke checklist in
    #          tools/data-sizing/README.md — re-implements the inlined
    #          DOM-handler bits of app.js (storage math, share-URL
    #          serialiser/parser, CSV column synthesis) and asserts the
    #          numeric / data-layer behaviour so the eyeball pass can
    #          focus on rendering. Caught the v8.7.0 PAN "~0.7 GB/day"
    #          units typo in the original plan / README.)
    #   3. Advisory calibration coverage report (always exit 0 — no
    #      gating until the catalogue reaches the threshold described
    #      in docs/superpowers/specs/2026-05-22-data-sizing-realism-design.md
    #      §11). The advisory mode lets reviewers track calibration
    #      progress release-over-release without blocking unrelated PRs.
    # The job uses ./.github/actions/setup-python and ./.github/actions/setup-node
    # per the repo-wide policy enforced by
    # tests/build/test_composite_actions.py (no raw setup-{python,node}@<sha>
    # pins in workflow files).
    name: data-sizing-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          install-deps: "false"
      - name: Validate v2 catalogue against schema
        run: python3 tools/data-sizing/scripts/validate-catalogue.py
      - name: Compute function unit tests
        run: node --test tools/data-sizing/__tests__/*.test.js
      - name: Calibration coverage (advisory)
        run: python3 tools/data-sizing/scripts/calibration-coverage.py

  deploy:
    # Waits only for the catalog build. Once main has been green for a
    # week, this job should also need the content checks:
    # lint, audits-content, audits-build, mcp, frontend.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  fixtures:
    name: Validate fixtures
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"

      - name: Download catalog build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-dist
          path: .
      - name: Unpack catalog build
        run: tar -xzf catalog-dist.tar.gz && rm -f catalog-dist.tar.gz

      - name: Validate sample manifests
        run: python3 scripts/samples_index.py --strict

      - name: Dry-run test runner
        run: python3 scripts/run_uc_tests.py --dry-run

      - name: Upload dry-run JUnit artefact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-dry-run
          path: test-results/

  precheck:
    name: Precheck secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        name: Check Splunk test secrets
        env:
          UC_PW: ${{ secrets.UC_TEST_SPLUNK_PASSWORD }}
        run: |
          if [ -n "${UC_PW}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
            echo "UC_TEST_SPLUNK_PASSWORD is configured — E2E job will run."
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UC_TEST_SPLUNK_PASSWORD not set; skipping E2E run. See docs/enterprise-deployment.md for how to configure."
          fi

  splunk-e2e:
    name: Run against Splunk Enterprise
    needs: precheck
    if: >-
      needs.precheck.outputs.has-secrets == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      splunk:
        image: splunk/splunk:9.4.1
        env:
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_PASSWORD: ${{ secrets.UC_TEST_SPLUNK_PASSWORD }}
          SPLUNK_HEC_TOKEN: ${{ secrets.UC_TEST_HEC_TOKEN }}
        ports:
          - 8000:8000
          - 8088:8088
          - 8089:8089
        options: >-
          --health-cmd "curl -ksSf https://localhost:8089/services/server/info --user admin:$SPLUNK_PASSWORD || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 120s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"

      - name: Wait for Splunk
        env:
          SPLUNK_PASSWORD: ${{ secrets.UC_TEST_SPLUNK_PASSWORD }}
        run: |
          for i in {1..60}; do
            if curl -ksSf -u "admin:${SPLUNK_PASSWORD}" \
                 https://localhost:8089/services/server/info >/dev/null 2>&1; then
              echo "Splunk is up."
              exit 0
            fi
            echo "  waiting ($i)..."
            sleep 10
          done
          echo "Splunk did not become healthy in time."
          exit 1

      - name: Create indexes referenced by manifests
        env:
          SPLUNK_PASSWORD: ${{ secrets.UC_TEST_SPLUNK_PASSWORD }}
        run: |
          INDEXES=$(python3 -c "
          import glob, os, sys
          sys.path.insert(0, 'scripts')
          from samples_index import _load_yaml
          names = set()
          for m in glob.glob('samples/UC-*/manifest.yaml'):
              try:
                  names.add(_load_yaml(__import__('pathlib').Path(m)).get('index'))
              except Exception:
                  pass
          print(' '.join(sorted(n for n in names if n and not n.startswith('_'))))
          ")
          for IDX in $INDEXES; do
            echo "Creating index $IDX"
            curl -ksS -u "admin:${SPLUNK_PASSWORD}" \
              -d "name=${IDX}" \
              https://localhost:8089/services/data/indexes >/dev/null || true
          done

      - name: Enable HEC
        env:
          SPLUNK_PASSWORD: ${{ secrets.UC_TEST_SPLUNK_PASSWORD }}
          SPLUNK_HEC_TOKEN: ${{ secrets.UC_TEST_HEC_TOKEN }}
        run: |
          curl -ksS -u "admin:${SPLUNK_PASSWORD}" \
            -X POST \
            -d "disabled=0" \
            -d "enableSSL=1" \
            https://localhost:8089/services/data/inputs/http/http >/dev/null
          curl -ksS -u "admin:${SPLUNK_PASSWORD}" \
            -X POST \
            -d "name=uc-tests" \
            -d "token=${SPLUNK_HEC_TOKEN}" \
            -d "index=main" \
            -d "indexes=main,os,wineventlog,aws,k8s,network,firewall,ids,devops,_internal" \
            -d "disabled=0" \
            https://localhost:8089/servicesNS/admin/splunk_httpinput/data/inputs/http >/dev/null \
            || echo "(HEC token may already exist)"

      - name: Run UC tests
        env:
          SPLUNK_URL: https://localhost:8089
          SPLUNK_HEC_URL: https://localhost:8088
          SPLUNK_HEC_TOKEN: ${{ secrets.UC_TEST_HEC_TOKEN }}
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: ${{ secrets.UC_TEST_SPLUNK_PASSWORD }}
          SPLUNK_VERIFY_TLS: "0"
        run: |
          FILTER='${{ github.event.inputs.uc_filter }}'
          if [ -n "$FILTER" ]; then
            python3 scripts/run_uc_tests.py --filter "$FILTER"
          else
            python3 scripts/run_uc_tests.py
          fi

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-splunk-e2e
          path: test-results/

  manifest:
    name: UC manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Generate manifest-all.json
        run: python3 scripts/parse_uc_catalog.py --output /tmp/manifest-all.json --check

      - name: Validate JSON and UC count
        run: |
          python3 - <<'PY'
          import json
          with open("/tmp/manifest-all.json", encoding="utf-8") as f:
              d = json.load(f)
          n = d.get("uc_count", 0)
          assert n >= 4000, f"expected uc_count >= 4000, got {n}"
          assert len(d.get("use_cases", [])) == n
          print("ok: uc_count =", n)
          PY

      - name: HEC NDJSON generator (top 10)
        run: |
          PYTHONPATH=src python3 -m splunk_uc generate-manifest-samples \
            --manifest eventgen_data/manifest-top10.json \
            --output /tmp/top10.ndjson
          test -s /tmp/top10.ndjson

