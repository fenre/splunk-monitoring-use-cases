# Repo-overhaul plan §P4 (build reproducibility tracker), 2026-05-09.
#
# Continuously verifies that two consecutive ``tools/build/build.py
# --reproducible`` invocations against the same git HEAD produce
# byte-identical output. The audit is too slow (~90s) for per-PR CI;
# instead we run it nightly + on-demand, plus on every PR that touches
# the build pipeline itself.
#
# The contract is asserted by ``python3 -m splunk_uc audit-reproducibility``
# which compares ``dist/integrity.json`` between two builds. That file
# carries the sha256 of every other file in dist/, so byte-identical
# integrity files prove the entire tree is byte-identical.
#
# When the audit fails the workflow uploads both build trees as
# artifacts so the maintainer can diff them locally.
name: Build reproducibility

on:
  schedule:
    # Nightly 03:00 UTC — quiet window for free-tier runners.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      keep_artifacts:
        description: "Upload both build trees as artifacts even on success."
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # Only on PRs that touch the build pipeline itself. Per-PR cost
    # is acceptable here because if we change build code, we must
    # know we didn't break reproducibility.
    paths:
      - "tools/build/**"
      - "schemas/v2/build-info.schema.json"
      - "schemas/v2/integrity.schema.json"
      - "python3 -m splunk_uc audit-reproducibility"
      - "src/splunk_uc/audits/build_reproducibility.py"
      - "src/splunk_uc/__main__.py"
      - "src/splunk_uc/_registry.py"
      - ".github/workflows/build-reproducibility.yml"

# Two reproducibility audits never need to overlap on the same ref.
concurrency:
  group: build-reproducibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Full history so audit can read git HEAD epoch.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        # F19 (2026-05-12): centralised in the composite action so the
        # toolchain pin lives in one file instead of rippling across
        # nine workflows. ``install-audits: true`` installs
        # ``.github/requirements-ci.txt`` (jsonschema==4.23.0,
        # PyYAML==6.0.2) — the same jsonschema pin the old inline
        # ``pip install jsonschema==4.23.0`` step provided. The
        # redundant ``Install dev dependencies`` step is therefore
        # dropped in this commit.
        uses: ./.github/actions/setup-python
        with:
          install-audits: "true"
          # audits + dev: the license-inventory tests and the rollups
          # import every declared dependency.
          install-extras: "audits,test,dev"

      - name: Reproducibility audit (two consecutive --reproducible builds)
        # The dispatcher path is the canonical entry point as of P6
        # (2026-05-09); the legacy ``scripts/...`` shim still works
        # but is scheduled for deletion in v9. Running the audit
        # through the dispatcher exercises the new CLI surface
        # continuously so the migration can't bit-rot.
        run: PYTHONPATH=src python3 -m splunk_uc audit-reproducibility --keep
        # ``--keep`` so the temp build trees survive the run; we
        # capture their paths from stderr and upload them on failure.
        # If the audit passes, the cleanup happens implicitly when
        # the runner shuts down.

      - name: Install MCP subpackage (required by audit-license-inventory)
        # The license-inventory tests import every declared dependency,
        # including ``mcp`` from mcp/pyproject.toml, which ``.[test]``
        # does not pull in.
        run: pip install --disable-pip-version-check -e 'mcp/[test]'

      - name: Set up Node.js
        uses: ./.github/actions/setup-node
        with:
          install-deps: "true"

      - name: Coverage budget audit (per-file ratchet vs baseline)
        # Same suite as pull-request CI, plus coverage. The --cov filter
        # for tools/build is a filesystem path, not a module name: tests
        # import ``build.*`` via tools/ on sys.path, and a module filter
        # records those files at 0%. splunk_uc stays a module filter
        # because tests import it as ``splunk_uc``.
        run: |
          PYTHONPATH=src python3 -m pytest tests/build/ tests/scripts/ tests/splunk_uc/ -q -n auto --dist loadscope -m "not nightly" \
            --cov=tools/build --cov=splunk_uc \
            --cov-report=json:coverage-report.json
          PYTHONPATH=src python3 -m splunk_uc audit-coverage-budget \
            --baseline data/baselines/coverage-v9.1.0.json \
            --report coverage-report.json

      - name: Build smoke test
        # One real build. Kept off the pull-request unit-test step
        # (pytest -m "not nightly"); the nightly run is where it belongs.
        run: PYTHONPATH=src python3 -m splunk_uc audit-reproducibility --first-build-only

      # Reports. They print counts to the job summary and never fail the
      # run; no pull request runs them.
      - name: Full build for the reports
        if: github.event_name != 'pull_request'
        run: |
          ( cd apps/web && npm ci --no-audit --no-fund )
          python3 tools/build/build.py --out dist --only parse meta --reproducible
          make generate-published-rollups
          python3 tools/build/build.py --out dist --reproducible

      - name: Report — content quality counts
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          report() {
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            shift
            "$@" 2>&1 | tail -n 40 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          report "Gold profile v2" sh -c 'python3 -m splunk_uc audit-gold-profile-v2 | head -n 5'
          report "Text quality (major findings)" python3 -m splunk_uc audit-text-quality --no-write --no-spelling
          report "Template provenance" python3 -m splunk_uc audit-template-provenance
          report "Content quality" python3 -m splunk_uc audit-content-quality
          report "SPL anti-patterns" python3 -m splunk_uc audit-spl-anti-patterns
          report "Byte budgets" python3 tools/audits/budgets.py --dist dist
          report "File size budgets and accessibility" python3 -m splunk_uc audit-perf-a11y

      - name: Upload build trees on failure
        if: failure() || (success() && inputs.keep_artifacts == true)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-builds-${{ github.run_id }}
          path: |
            /tmp/build-repro-*/build-a/integrity.json
            /tmp/build-repro-*/build-b/integrity.json
            /tmp/build-repro-*/build-a/manifest.json
            /tmp/build-repro-*/build-b/manifest.json
            /tmp/build-repro-*/build-a/BUILD-INFO.json
            /tmp/build-repro-*/build-b/BUILD-INFO.json
          if-no-files-found: warn
          retention-days: 7
